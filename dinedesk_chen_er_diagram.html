<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DineDesk - Chen-Style Entity Relationship (ER) Diagram</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #070c18;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    /* Clean Dot Grid Canvas */
    .dot-grid {
      background-size: 32px 32px;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.14) 1.2px, transparent 1.2px);
      background-color: #060a14;
    }
    .entity-box {
      cursor: grab;
      transition: box-shadow 0.15s ease;
      touch-action: none;
    }
    .entity-box:active {
      cursor: grabbing;
    }
    .entity-box:hover {
      box-shadow: 0 0 25px currentColor !important;
      z-index: 30 !important;
    }
    .attr-pill {
      cursor: grab;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
      touch-action: none;
    }
    .attr-pill:active {
      cursor: grabbing;
      transform: scale(1.12) translate(-50%, -50%) !important;
      z-index: 60 !important;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }
    .attr-pill:hover {
      transform: scale(1.06) translate(-50%, -50%);
      z-index: 50;
    }
    .rel-diamond {
      cursor: grab;
      transition: filter 0.15s ease;
      touch-action: none;
    }
    .rel-diamond:active {
      cursor: grabbing;
    }
    .rel-diamond:hover {
      filter: drop-shadow(0 0 12px #818cf8);
    }
    .stem-wire {
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      opacity: 0.8;
      pointer-events: none;
    }
    .rel-wire {
      fill: none;
      stroke: #475569;
      stroke-width: 2;
      stroke-linecap: round;
      pointer-events: none;
    }
    .rel-wire.active {
      stroke: #38bdf8;
      stroke-width: 3;
    }
    .cardinality-badge {
      font-family: monospace;
      font-size: 11px;
      font-weight: 800;
      fill: #f8fafc;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col">

        </div>
      </div>

      </div>
    </div>

    <!-- Quick Tool Controls -->
    <div class="flex items-center gap-3 text-xs">
      
      <!-- Layout Style Mode -->
      <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg p-1 text-[11px] gap-1">
        <span class="text-slate-400 px-1 font-medium">Style:</span>
        <button id="modeFan" onclick="setAttrMode('fan')" class="px-2 py-0.5 rounded bg-sky-600 text-white font-semibold">Fan (Chen)</button>
        <button id="modeStack" onclick="setAttrMode('stack')" class="px-2 py-0.5 rounded text-slate-400 hover:text-white">Clean Stack</button>
      </div>

      <!-- Spacing Spreader -->
      <div class="hidden md:flex items-center bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 gap-2 text-[11px]">
        <span class="text-slate-400">Spacing:</span>
        <button onclick="adjustSpacing(1.15)" title="Spread Out Further" class="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-bold">+</button>
        <button onclick="adjustSpacing(0.88)" title="Compress Spacing" class="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-bold">−</button>
      </div>

      <!-- Search Bar -->
      <div class="relative">
        <input type="text" id="searchInput" placeholder="Search table or column..." oninput="handleSearch(this.value)"

        <svg class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>

      <!-- Zoom Controls -->
      <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5">
        <button onclick="zoomDelta(-0.12)" class="px-2 py-1 text-slate-300 hover:text-white font-bold text-sm">−</button>
        <button onclick="resetZoom()" class="px-2 py-1 text-[11px] text-slate-400 hover:text-white border-x border-slate-800">100%</button>
        <button onclick="zoomDelta(0.12)" class="px-2 py-1 text-slate-300 hover:text-white font-bold text-sm">+</button>
      </div>

      <button onclick="resetToSpaciousLayout()" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-semibold shadow-md shadow-sky-600/30 flex items-center gap-1.5 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span>Reset Layout</span>
      </button>
    </div>
  </header>

  <!-- Interactive Infinite Canvas -->
  <main class="flex-1 relative overflow-hidden dot-grid" id="canvasViewport">
    
    <!-- SVG Vector Layer for Relationship Wires, Attribute Stems, Diamonds & Cardinalities -->
    <svg id="svgLayer" class="absolute inset-0 w-full h-full pointer-events-none" style="overflow: visible;">
      <g id="relWiresGroup"></g>
      <g id="attrStemsGroup"></g>
      <g id="diamondsGroup" class="pointer-events-auto"></g>
      <g id="cardinalityGroup"></g>
    </svg>

    <!-- World Container for Entity Boxes and Attribute Capsules -->
    <div id="diagramWorld" class="absolute inset-0 origin-top-left" style="transform: translate(80px, 60px) scale(0.68);">
      <div id="entitiesLayer" class="relative"></div>
      <div id="attributesLayer" class="relative"></div>
    </div>

    <!-- Floating Live Instruction Toast -->

      <div class="flex items-center gap-2">
        <span class="w-4 h-3 rounded border-2 border-sky-400 bg-sky-950/70 inline-block"></span>
        <span class="font-bold text-white">Drag Entity</span>
        <span class="text-slate-500 text-[11px]">(moves table + its capsules)</span>
      </div>
      <div class="flex items-center gap-2">

      <div class="text-[11px] text-slate-400">
        ✨ <em>Positions auto-save to browser storage</em>
      </div>
    </div>
  </main>

    // State Variables
    let scale = 0.68;
    let panX = 80;
    let panY = 60;
    let isPanning = false;
    let startX, startY;
    let activeCluster = 'ALL';
    let attrLayoutMode = 'fan'; // 'fan' or 'stack'
    let customDiamondOffsets = {};

    // Drag States: entity, individual pill, or diamond
    let dragTarget = null; // { type: 'entity'|'pill'|'diamond', item: object }
    let dragOffset = { x: 0, y: 0 };

    const viewport = document.getElementById('canvasViewport');
    const world = document.getElementById('diagramWorld');
    const entitiesLayer = document.getElementById('entitiesLayer');
    const attributesLayer = document.getElementById('attributesLayer');
    const svgLayer = document.getElementById('svgLayer');
    const relWiresGroup = document.getElementById('relWiresGroup');
    const attrStemsGroup = document.getElementById('attrStemsGroup');
    const diamondsGroup = document.getElementById('diamondsGroup');
    const cardinalityGroup = document.getElementById('cardinalityGroup');

    // Initialize Diagram
    function init() {
      loadSavedPositions();
      renderEntities();
      renderAttributes();
      updateTransform();
      drawAllConnections();
      setupInteractions();
    }

    // Load custom positions from localStorage if available
    function loadSavedPositions() {
      try {
        const saved = localStorage.getItem('dinedesk_chen_layout_v2');
        if (saved) {
          const parsed = JSON.parse(saved);
          CHEN_DATA.entities.forEach(ent => {
            if (parsed.entities && parsed.entities[ent.id]) {
              ent.x = parsed.entities[ent.id].x;
              ent.y = parsed.entities[ent.id].y;
            } else if (SPACIOUS_LAYOUT[ent.id]) {
              ent.x = SPACIOUS_LAYOUT[ent.id].x;
              ent.y = SPACIOUS_LAYOUT[ent.id].y;
            }
            if (parsed.attributes && parsed.attributes[ent.id]) {
              ent.attributes.forEach((attr, idx) => {
                if (parsed.attributes[ent.id][attr.id || idx]) {
                  attr.ox = parsed.attributes[ent.id][attr.id || idx].ox;
                  attr.oy = parsed.attributes[ent.id][attr.id || idx].oy;
                }
              });
            }
          });
          if (parsed.diamonds) customDiamondOffsets = parsed.diamonds;
          return;
        }
      } catch(e) {}

      // Default to Spacious Layout
      CHEN_DATA.entities.forEach(ent => {
        if (SPACIOUS_LAYOUT[ent.id]) {
          ent.x = SPACIOUS_LAYOUT[ent.id].x;
          ent.y = SPACIOUS_LAYOUT[ent.id].y;
        }
      });
    }

    function savePositionsToStorage() {
      try {
        const payload = {
          entities: {},
          attributes: {},
          diamonds: customDiamondOffsets
        };
        CHEN_DATA.entities.forEach(ent => {
          payload.entities[ent.id] = { x: ent.x, y: ent.y };
          payload.attributes[ent.id] = {};
          ent.attributes.forEach((attr, idx) => {
            payload.attributes[ent.id][attr.id || idx] = { ox: attr.ox, oy: attr.oy };
          });
        });
        localStorage.setItem('dinedesk_chen_layout_v2', JSON.stringify(payload));
      } catch(e) {}
    }

    // Render Entity Boxes
    function renderEntities() {
      entitiesLayer.innerHTML = '';
      CHEN_DATA.entities.forEach(ent => {
        const cl = CHEN_DATA.clusters[ent.cluster];
        const el = document.createElement('div');
        el.id = `entity-${ent.id}`;
        el.className = `entity-box absolute rounded-lg font-extrabold text-center flex items-center justify-center tracking-wider text-xs shadow-xl`;
        el.style.left = `${ent.x}px`;
        el.style.top = `${ent.y}px`;
        el.style.width = `${ent.w}px`;
        el.style.height = `${ent.h}px`;
        el.style.border = `2.5px solid ${cl.color}`;
        el.style.backgroundColor = '#0b1329';
        el.style.color = cl.color;
        el.style.boxShadow = `0 0 16px ${cl.bg}`;
        el.innerText = ent.name;

        // Mouse Down for Entity Drag
        el.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          dragTarget = { type: 'entity', item: ent };
          const rect = el.getBoundingClientRect();
          dragOffset.x = (e.clientX - rect.left) / scale;
          dragOffset.y = (e.clientY - rect.top) / scale;
        });

        entitiesLayer.appendChild(el);
      });
    }

    // Render Attribute Capsules
    function renderAttributes() {
      attributesLayer.innerHTML = '';
      CHEN_DATA.entities.forEach(ent => {
        const cl = CHEN_DATA.clusters[ent.cluster];
        ent.attributes.forEach((attr, idx) => {
          const pill = document.createElement('div');
          pill.id = `attr-${ent.id}-${attr.id || idx}`;
          pill.className = `attr-pill absolute px-3 py-1 rounded-full text-[11px] font-mono whitespace-nowrap border shadow-md backdrop-blur-md font-medium`;
          
          let posX, posY;
          if (attrLayoutMode === 'stack') {
            // Clean vertical stack right beside entity
            posX = ent.x + ent.w + 40;
            posY = ent.y + (idx * 34) - (ent.attributes.length * 17) + 24;
          } else {
            // Fan Mode with individual offsets
            posX = ent.x + (ent.w / 2) + attr.ox;
            posY = ent.y + (ent.h / 2) + attr.oy;
          }

          pill.style.left = `${posX}px`;
          pill.style.top = `${posY}px`;
          pill.style.transform = 'translate(-50%, -50%)';

          if (attr.type === 'pk') {
            pill.style.borderColor = '#facc15';
            pill.style.color = '#fde047';
            pill.style.backgroundColor = 'rgba(234, 179, 8, 0.2)';
            pill.style.boxShadow = '0 0 10px rgba(234, 179, 8, 0.35)';
          } else if (attr.type === 'fk') {
            pill.style.borderColor = '#38bdf8';
            pill.style.color = '#7dd3fc';
            pill.style.backgroundColor = 'rgba(56, 189, 248, 0.15)';
          } else if (attr.type === 'uq') {
            pill.style.borderColor = '#c084fc';
            pill.style.color = '#e9d5ff';
            pill.style.backgroundColor = 'rgba(192, 132, 252, 0.15)';
          } else {
            pill.style.borderColor = cl.border;
            pill.style.color = '#cbd5e1';
            pill.style.backgroundColor = '#0f172a';
          }

          pill.innerText = attr.name;

          // Drag Listener for THIS INDIVIDUAL PILL ONLY!
          pill.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            e.stopPropagation();
            dragTarget = { type: 'pill', item: attr, parent: ent };
            const rect = pill.getBoundingClientRect();
            dragOffset.x = (e.clientX - rect.left) / scale;
            dragOffset.y = (e.clientY - rect.top) / scale;
          });

          attributesLayer.appendChild(pill);
        });
      });
    }

    // Draw Vector Lines, Stems & Diamonds
    function drawAllConnections() {
      relWiresGroup.innerHTML = '';
      attrStemsGroup.innerHTML = '';
      diamondsGroup.innerHTML = '';
      cardinalityGroup.innerHTML = '';

      // 1. Draw Attribute Stems
      CHEN_DATA.entities.forEach(ent => {
        const cl = CHEN_DATA.clusters[ent.cluster];
        const eCenter = { x: ent.x + ent.w / 2, y: ent.y + ent.h / 2 };

        ent.attributes.forEach((attr, idx) => {
          const attrEl = document.getElementById(`attr-${ent.id}-${attr.id || idx}`);
          if (!attrEl) return;

          let aCenter;
          if (attrLayoutMode === 'stack') {
            aCenter = {
              x: ent.x + ent.w + 40,
              y: ent.y + (idx * 34) - (ent.attributes.length * 17) + 24
            };
          } else {
            aCenter = {
              x: ent.x + (ent.w / 2) + attr.ox,
              y: ent.y + (ent.h / 2) + attr.oy
            };
          }

          const cpX = (eCenter.x + aCenter.x) / 2;
          const cpY = (eCenter.y + aCenter.y) / 2;
          const pathData = `M ${eCenter.x} ${eCenter.y} Q ${cpX} ${cpY}, ${aCenter.x} ${aCenter.y}`;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', pathData);
          path.setAttribute('class', 'stem-wire');
          path.setAttribute('stroke', cl.color);
          attrStemsGroup.appendChild(path);
        });
      });

      // 2. Draw Relationships with Diamond Connectors
      CHEN_DATA.relationships.forEach(rel => {
        const e1 = CHEN_DATA.entities.find(e => e.id === rel.e1);
        const e2 = CHEN_DATA.entities.find(e => e.id === rel.e2);
        if (!e1 || !e2) return;

        const c1 = { x: e1.x + e1.w / 2, y: e1.y + e1.h / 2 };
        const c2 = { x: e2.x + e2.w / 2, y: e2.y + e2.h / 2 };

        // Check if custom diamond offset exists
        let dCenter;
        if (customDiamondOffsets[rel.id]) {
          dCenter = {
            x: ((c1.x + c2.x) / 2) + customDiamondOffsets[rel.id].ox,
            y: ((c1.y + c2.y) / 2) + customDiamondOffsets[rel.id].oy
          };
        } else {
          dCenter = { x: (c1.x + c2.x) / 2, y: (c1.y + c2.y) / 2 };
        }

        // Draw Line 1 (E1 to Diamond)
        const line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line1.setAttribute('x1', c1.x);
        line1.setAttribute('y1', c1.y);
        line1.setAttribute('x2', dCenter.x);
        line1.setAttribute('y2', dCenter.y);
        line1.setAttribute('class', 'rel-wire');
        relWiresGroup.appendChild(line1);

        // Draw Line 2 (Diamond to E2)
        const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line2.setAttribute('x1', dCenter.x);
        line2.setAttribute('y1', dCenter.y);
        line2.setAttribute('x2', c2.x);
        line2.setAttribute('y2', c2.y);
        line2.setAttribute('class', 'rel-wire');
        relWiresGroup.appendChild(line2);

        // Draw Diamond Rhombus Shape
        const diamondSize = 34;
        const dGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        dGroup.setAttribute('class', 'rel-diamond');
        dGroup.setAttribute('transform', `translate(${dCenter.x}, ${dCenter.y})`);

        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', `0,-${diamondSize} ${diamondSize*1.35},0 0,${diamondSize} -${diamondSize*1.35},0`);
        polygon.setAttribute('fill', '#0f172a');
        polygon.setAttribute('stroke', '#6366f1');
        polygon.setAttribute('stroke-width', '2.2');
        polygon.setAttribute('filter', 'drop-shadow(0 0 8px rgba(99, 102, 241, 0.45))');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dy', '4');
        text.setAttribute('fill', '#a5b4fc');
        text.setAttribute('font-size', '10px');
        text.setAttribute('font-weight', '800');
        text.textContent = rel.name;

        dGroup.appendChild(polygon);
        dGroup.appendChild(text);

        // Drag THIS DIAMOND INDEPENDENTLY!
        dGroup.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          if (!customDiamondOffsets[rel.id]) customDiamondOffsets[rel.id] = { ox: 0, oy: 0 };
          dragTarget = { type: 'diamond', rel: rel, initialMid: { x: (c1.x + c2.x)/2, y: (c1.y + c2.y)/2 } };
          dragOffset.x = (e.clientX / scale) - dCenter.x;
          dragOffset.y = (e.clientY / scale) - dCenter.y;
        });

        diamondsGroup.appendChild(dGroup);

        // Cardinalities
        const card1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        const posC1 = { x: c1.x + (dCenter.x - c1.x) * 0.35 + 8, y: c1.y + (dCenter.y - c1.y) * 0.35 - 8 };
        card1.setAttribute('x', posC1.x);
        card1.setAttribute('y', posC1.y);
        card1.setAttribute('class', 'cardinality-badge');
        card1.textContent = rel.c1;
        cardinalityGroup.appendChild(card1);

        const card2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        const posC2 = { x: dCenter.x + (c2.x - dCenter.x) * 0.65 + 8, y: dCenter.y + (c2.y - dCenter.y) * 0.65 - 8 };
        card2.setAttribute('x', posC2.x);
        card2.setAttribute('y', posC2.y);
        card2.setAttribute('class', 'cardinality-badge');
        card2.textContent = rel.c2;
        cardinalityGroup.appendChild(card2);
      });
    }

    function updateTransform() {
      const transformStr = `translate(${panX}px, ${panY}px) scale(${scale})`;
      world.style.transform = transformStr;
      svgLayer.style.transform = transformStr;
      svgLayer.style.transformOrigin = '0 0';
    }

    function zoomDelta(dz) {
      scale = Math.min(Math.max(0.2, scale + dz), 2.5);
      updateTransform();
      drawAllConnections();
    }

    function resetZoom() {
      scale = 0.68;
      panX = 80;
      panY = 60;
      updateTransform();
      drawAllConnections();
    }

    function setAttrMode(mode) {
      attrLayoutMode = mode;
      document.getElementById('modeFan').className = mode === 'fan' ? 'px-2 py-0.5 rounded bg-sky-600 text-white font-semibold' : 'px-2 py-0.5 rounded text-slate-400 hover:text-white';
      document.getElementById('modeStack').className = mode === 'stack' ? 'px-2 py-0.5 rounded bg-sky-600 text-white font-semibold' : 'px-2 py-0.5 rounded text-slate-400 hover:text-white';
      renderAttributes();
      drawAllConnections();
    }

    function adjustSpacing(factor) {
      const centerX = 1500;
      const centerY = 1500;
      CHEN_DATA.entities.forEach(ent => {
        ent.x = Math.round(centerX + (ent.x - centerX) * factor);
        ent.y = Math.round(centerY + (ent.y - centerY) * factor);
        const el = document.getElementById(`entity-${ent.id}`);
        if (el) {
          el.style.left = `${ent.x}px`;
          el.style.top = `${ent.y}px`;
        }
      });
      renderAttributes();
      drawAllConnections();
      savePositionsToStorage();
    }

    function resetToSpaciousLayout() {
      localStorage.removeItem('dinedesk_chen_layout_v2');
      customDiamondOffsets = {};
      CHEN_DATA.entities.forEach(ent => {
        if (SPACIOUS_LAYOUT[ent.id]) {
          ent.x = SPACIOUS_LAYOUT[ent.id].x;
          ent.y = SPACIOUS_LAYOUT[ent.id].y;
          const el = document.getElementById(`entity-${ent.id}`);
          if (el) {
            el.style.left = `${ent.x}px`;
            el.style.top = `${ent.y}px`;
          }
        }
      });
      scale = 0.68;
      panX = 80;
      panY = 60;
      updateTransform();
      renderAttributes();
      drawAllConnections();
    }

    function filterCluster(clusterKey) {
      activeCluster = clusterKey;
      document.querySelectorAll('.cluster-btn').forEach(b => {
        if (b.dataset.cluster === clusterKey) {
          b.classList.add('bg-slate-800', 'text-white');
        } else {
          b.classList.remove('bg-slate-800', 'text-white');
        }
      });

      CHEN_DATA.entities.forEach(ent => {
        const el = document.getElementById(`entity-${ent.id}`);
        if (!el) return;
        if (clusterKey === 'ALL' || ent.cluster === clusterKey) {
          el.style.display = 'flex';
        } else {
          el.style.display = 'none';
        }
      });

      renderAttributes();
      drawAllConnections();
    }

    function handleSearch(query) {
      const q = query.trim().toUpperCase();
      if (!q) {
        document.querySelectorAll('.entity-box').forEach(e => e.style.opacity = '1');
        document.querySelectorAll('.attr-pill').forEach(a => a.style.opacity = '1');
        return;
      }

      CHEN_DATA.entities.forEach(ent => {
        const entEl = document.getElementById(`entity-${ent.id}`);
        const matchEnt = ent.name.includes(q);
        const matchAttr = ent.attributes.some(a => a.name.toUpperCase().includes(q));

        if (matchEnt || matchAttr) {
          entEl.style.opacity = '1';
        } else {
          entEl.style.opacity = '0.15';
        }

        ent.attributes.forEach((a, i) => {
          const attrEl = document.getElementById(`attr-${ent.id}-${a.id || i}`);
          if (attrEl) {
            attrEl.style.opacity = (a.name.toUpperCase().includes(q) || matchEnt) ? '1' : '0.15';
          }
        });
      });
    }

    // Unified Drag Interactions
    function setupInteractions() {
      // Pan Canvas
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.entity-box') || e.target.closest('.attr-pill') || e.target.closest('.rel-diamond') || e.target.closest('button') || e.target.closest('input')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (isPanning) {
          panX = e.clientX - startX;
          panY = e.clientY - startY;
          updateTransform();
        } else if (dragTarget) {
          const worldRect = world.getBoundingClientRect();

          // 1. Moving an Entity (Leaves other entities untouched)
          if (dragTarget.type === 'entity') {
            const ent = dragTarget.item;
            const newX = (e.clientX - worldRect.left) / scale - dragOffset.x;
            const newY = (e.clientY - worldRect.top) / scale - dragOffset.y;
            ent.x = Math.max(0, newX);
            ent.y = Math.max(0, newY);

            const el = document.getElementById(`entity-${ent.id}`);
            if (el) {
              el.style.left = `${ent.x}px`;
              el.style.top = `${ent.y}px`;
            }

            // Sync this entity's own pills
            ent.attributes.forEach((attr, idx) => {
              const attrEl = document.getElementById(`attr-${ent.id}-${attr.id || idx}`);
              if (attrEl) {
                let aX, aY;
                if (attrLayoutMode === 'stack') {
                  aX = ent.x + ent.w + 40;
                  aY = ent.y + (idx * 34) - (ent.attributes.length * 17) + 24;
                } else {
                  aX = ent.x + (ent.w / 2) + attr.ox;
                  aY = ent.y + (ent.h / 2) + attr.oy;
                }
                attrEl.style.left = `${aX}px`;
                attrEl.style.top = `${aY}px`;
              }
            });
            drawAllConnections();
          }

          // 2. Moving an INDIVIDUAL PILL ONLY!
          else if (dragTarget.type === 'pill') {
            const attr = dragTarget.item;
            const parentEnt = dragTarget.parent;
            
            // Mouse in world coordinates
            const currentMouseX = (e.clientX - worldRect.left) / scale;
            const currentMouseY = (e.clientY - worldRect.top) / scale;

            attr.ox = currentMouseX - (parentEnt.x + parentEnt.w / 2);
            attr.oy = currentMouseY - (parentEnt.y + parentEnt.h / 2);

            const pillEl = document.getElementById(`attr-${parentEnt.id}-${attr.id}`);
            if (pillEl) {
              pillEl.style.left = `${parentEnt.x + (parentEnt.w / 2) + attr.ox}px`;
              pillEl.style.top = `${parentEnt.y + (parentEnt.h / 2) + attr.oy}px`;
            }
            drawAllConnections();
          }

          // 3. Moving a Relationship Diamond
          else if (dragTarget.type === 'diamond') {
            const rel = dragTarget.rel;
            const currentMouseX = (e.clientX / scale) - dragOffset.x;
            const currentMouseY = (e.clientY / scale) - dragOffset.y;

            customDiamondOffsets[rel.id] = {
              ox: currentMouseX - dragTarget.initialMid.x,
              oy: currentMouseY - dragTarget.initialMid.y
            };
            drawAllConnections();
          }
        }
      });

      window.addEventListener('mouseup', () => {
        if (isPanning) {
          isPanning = false;
          viewport.style.cursor = 'default';
        }
        if (dragTarget) {
          savePositionsToStorage();
          dragTarget = null;
        }
      });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomDelta(e.deltaY < 0 ? 0.08 : -0.08);
      }, { passive: false });

      window.addEventListener('resize', () => {
        drawAllConnections();
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
