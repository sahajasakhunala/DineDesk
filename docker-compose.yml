version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dinedesk_postgres
    environment:
      POSTGRES_USER: dinedesk_user
      POSTGRES_PASSWORD: dinedesk_password
      POSTGRES_DB: dinedesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
