<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DineDesk - Chen-Style Entity Relationship (ER) Diagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #070c18;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      height: 56px;
      background: #090f1d;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    /* Cluster Filter Pills */
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cluster-btn {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      background: #111827;
      border: 1px solid #374151;
      color: #9ca3af;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .cluster-btn:hover {
      color: #ffffff;
      border-color: #4b5563;
    }
    .cluster-btn.active {
      background: #1e293b;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .btn-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Right Controls */
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-box {
      position: relative;
    }
    .search-input {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 6px 12px 6px 28px;
      font-size: 12px;
      color: #e5e7eb;
      width: 180px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-input:focus {
      border-color: #38bdf8;
    }
    .search-icon {
      position: absolute;
      left: 9px;
      top: 8px;
      width: 12px;
      height: 12px;
      fill: none;
      stroke: #6b7280;
    }
    .tool-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .tool-btn:hover {
      background: #334155;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }

    /* Infinite Canvas */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-size: 32px 32px;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.13) 1.2px, transparent 1.2px);
      background-color: #060a14;
    }
    #svgLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    #diagramWorld {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
    }

    /* Entity Cards */
    .entity-box {
      position: absolute;
      border-radius: 8px;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      background: #0b1329;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: box-shadow 0.15s ease;
      z-index: 20;
    }
    .entity-box:active {
      cursor: grabbing;
      z-index: 40 !important;
    }

    /* Attribute Capsules */
    .attr-pill {
      position: absolute;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      white-space: nowrap;
      cursor: grab;
      touch-action: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 25;
      transition: transform 0.1s ease;
    }
    .attr-pill:hover {
      transform: scale(1.08) translate(-50%, -50%);
      z-index: 50;
    }
    .attr-pill:active {
      cursor: grabbing;
      transform: scale(1.15) translate(-50%, -50%) !important;
      z-index: 60 !important;
    }

    /* Relationship Diamonds */
    .rel-diamond {
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }
    .rel-diamond:hover {
      filter: drop-shadow(0 0 10px #818cf8);
    }
    .rel-wire {
      stroke: #475569;
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .stem-wire {
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      opacity: 0.8;
    }
    .cardinality-text {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      font-weight: 800;
      fill: #f8fafc;
      user-select: none;
    }

    /* Floating Legend */
    .legend-card {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(9, 15, 29, 0.95);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: #94a3b8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 50;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f1f5f9;
      font-weight: 600;
    }
  </style>
</head>

            { id: "bi_qty", name: "quantity", type: "normal", ox: 50, oy: 85 },
            { id: "bi_tot", name: "total_price (Comp)", type: "normal", ox: -50, oy: 95 }
          ]
        },
        {
          id: "DISCOUNT", name: "DISCOUNT", cluster: "BILLING", w: 145, h: 48,
          attributes: [
            { id: "d_id", name: "id (PK)", type: "pk", ox: -70, oy: -85 },
            { id: "d_name", name: "name (UQ)", type: "uq", ox: 40, oy: -90 },
            { id: "d_type", name: "discount_type", type: "normal", ox: -135, oy: -15 },
            { id: "d_val", name: "value", type: "normal", ox: -125, oy: 40 },
            { id: "d_max", name: "max_discount_amount", type: "normal", ox: -40, oy: 85 },
            { id: "d_act", name: "is_active", type: "normal", ox: 60, oy: 85 }
          ]
        },
        {
          id: "DISCOUNT_APPLICATION", name: "DISCOUNT_APPLICATION", cluster: "BILLING", w: 210, h: 48,
          attributes: [
            { id: "da_id_pk", name: "id (PK)", type: "pk", ox: -80, oy: -85 },
            { id: "da_bid", name: "bill_id (FK)", type: "fk", ox: 0, oy: -95 },
            { id: "da_did", name: "discount_id (FK)", type: "fk", ox: 90, oy: -85 },
            { id: "da_auth", name: "authorized_by (FK)", type: "fk", ox: -60, oy: 85 },
            { id: "da_amt", name: "discount_amount", type: "normal", ox: 50, oy: 95 },
            { id: "da_rsn", name: "reason", type: "normal", ox: 120, oy: 20 }
          ]
        },
        {
          id: "PAYMENT", name: "PAYMENT", cluster: "BILLING", w: 145, h: 48,
          attributes: [
            { id: "p_id", name: "id (PK)", type: "pk", ox: -70, oy: 85 },
            { id: "p_bid", name: "bill_id (FK)", type: "fk", ox: 30, oy: 95 },
            { id: "p_amt", name: "amount", type: "normal", ox: 130, oy: -20 },
            { id: "p_pm", name: "payment_method", type: "normal", ox: 145, oy: 25 },
            { id: "p_stat", name: "status", type: "normal", ox: -130, oy: -15 },
            { id: "p_tx", name: "transaction_ref (UQ)", type: "uq", ox: -150, oy: 35 }
          ]
        }
      ],
      relationships: [
        { id: "rel_b_da", name: "has", e1: "BRANCH", e2: "DINING_AREA", c1: "1", c2: "N" },
        { id: "rel_da_t", name: "contains", e1: "DINING_AREA", e2: "TABLE_ENTITY", c1: "1", c2: "N" },
        { id: "rel_b_u", name: "employs", e1: "BRANCH", e2: "USER_ACCOUNT", c1: "1", c2: "N" },
        { id: "rel_r_u", name: "assigned_to", e1: "ROLE", e2: "USER_ACCOUNT", c1: "1", c2: "N" },
        { id: "rel_t_res", name: "reserved_for", e1: "TABLE_ENTITY", e2: "RESERVATION", c1: "1", c2: "N" },
        { id: "rel_c_res", name: "books", e1: "CUSTOMER", e2: "RESERVATION", c1: "1", c2: "N" },
        { id: "rel_t_sess", name: "hosts", e1: "TABLE_ENTITY", e2: "DINING_SESSION", c1: "1", c2: "N" },
        { id: "rel_c_sess", name: "attends", e1: "CUSTOMER", e2: "DINING_SESSION", c1: "1", c2: "N" },
        { id: "rel_res_sess", name: "fulfills", e1: "RESERVATION", e2: "DINING_SESSION", c1: "1", c2: "1" },
        { id: "rel_mc_mi", name: "categorizes", e1: "MENU_CATEGORY", e2: "MENU_ITEM", c1: "1", c2: "N" },
        { id: "rel_sess_ord", name: "places", e1: "DINING_SESSION", e2: "CUSTOMER_ORDER", c1: "1", c2: "N" },
        { id: "rel_u_ord", name: "takes", e1: "USER_ACCOUNT", e2: "CUSTOMER_ORDER", c1: "1", c2: "N" },
        { id: "rel_ord_oi", name: "includes", e1: "CUSTOMER_ORDER", e2: "ORDER_ITEM", c1: "1", c2: "N" },
        { id: "rel_mi_oi", name: "ordered_as", e1: "MENU_ITEM", e2: "ORDER_ITEM", c1: "1", c2: "N" },
        { id: "rel_ord_hist", name: "logs", e1: "CUSTOMER_ORDER", e2: "ORDER_STATUS_HISTORY", c1: "1", c2: "N" },
        { id: "rel_ord_kt", name: "generates", e1: "CUSTOMER_ORDER", e2: "KITCHEN_TICKET", c1: "1", c2: "1" },
        { id: "rel_kt_kti", name: "contains", e1: "KITCHEN_TICKET", e2: "KITCHEN_TICKET_ITEM", c1: "1", c2: "N" },
        { id: "rel_oi_kti", name: "routes_to", e1: "ORDER_ITEM", e2: "KITCHEN_TICKET_ITEM", c1: "1", c2: "N" },
        { id: "rel_sess_bill", name: "generates", e1: "DINING_SESSION", e2: "BILL", c1: "1", c2: "1" },
        { id: "rel_bill_bi", name: "itemizes", e1: "BILL", e2: "BILL_ITEM", c1: "1", c2: "N" },
        { id: "rel_oi_bi", name: "snapshots", e1: "ORDER_ITEM", e2: "BILL_ITEM", c1: "1", c2: "N" },
        { id: "rel_disc_da", name: "applied_via", e1: "DISCOUNT", e2: "DISCOUNT_APPLICATION", c1: "1", c2: "N" },
        { id: "rel_bill_da", name: "discounts", e1: "BILL", e2: "DISCOUNT_APPLICATION", c1: "1", c2: "N" },
        { id: "rel_u_da", name: "authorizes", e1: "USER_ACCOUNT", e2: "DISCOUNT_APPLICATION", c1: "1", c2: "N" },
        { id: "rel_bill_pay", name: "settles", e1: "BILL", e2: "PAYMENT", c1: "1", c2: "N" }
      ]
    };

    let scale = 0.68;
    let panX = 80;
    let panY = 60;
    let isPanning = false;
    let startX, startY;
    let activeCluster = 'ALL';
    let customDiamondOffsets = {};
    let dragTarget = null;
    let dragOffset = { x: 0, y: 0 };

    const viewport = document.getElementById('canvasViewport');
    const world = document.getElementById('diagramWorld');
    const entitiesLayer = document.getElementById('entitiesLayer');
    const attributesLayer = document.getElementById('attributesLayer');
    const svgLayer = document.getElementById('svgLayer');
    const relWiresGroup = document.getElementById('relWiresGroup');
    const attrStemsGroup = document.getElementById('attrStemsGroup');
    const diamondsGroup = document.getElementById('diamondsGroup');
    const cardinalityGroup = document.getElementById('cardinalityGroup');

    function init() {
      loadSavedPositions();
      renderEntities();
      renderAttributes();
      updateTransform();
      drawAllConnections();
      setupInteractions();
    }

    function loadSavedPositions() {
      try {
        const saved = localStorage.getItem('dinedesk_chen_layout_v3');
        if (saved) {
          const parsed = JSON.parse(saved);
          CHEN_DATA.entities.forEach(ent => {
            if (parsed.entities && parsed.entities[ent.id]) {
              ent.x = parsed.entities[ent.id].x;
              ent.y = parsed.entities[ent.id].y;
            } else if (SPACIOUS_LAYOUT[ent.id]) {
              ent.x = SPACIOUS_LAYOUT[ent.id].x;
              ent.y = SPACIOUS_LAYOUT[ent.id].y;
            }
            if (parsed.attributes && parsed.attributes[ent.id]) {
              ent.attributes.forEach((attr, idx) => {
                if (parsed.attributes[ent.id][attr.id || idx]) {
                  attr.ox = parsed.attributes[ent.id][attr.id || idx].ox;
                  attr.oy = parsed.attributes[ent.id][attr.id || idx].oy;
                }
              });
            }
          });
          if (parsed.diamonds) customDiamondOffsets = parsed.diamonds;
          return;
        }
      } catch(e) {}

      CHEN_DATA.entities.forEach(ent => {
        if (SPACIOUS_LAYOUT[ent.id]) {
          ent.x = SPACIOUS_LAYOUT[ent.id].x;
          ent.y = SPACIOUS_LAYOUT[ent.id].y;
        }
      });
    }

    function savePositionsToStorage() {
      try {
        const payload = { entities: {}, attributes: {}, diamonds: customDiamondOffsets };
        CHEN_DATA.entities.forEach(ent => {
          payload.entities[ent.id] = { x: ent.x, y: ent.y };
          payload.attributes[ent.id] = {};
          ent.attributes.forEach((attr, idx) => {
            payload.attributes[ent.id][attr.id || idx] = { ox: attr.ox, oy: attr.oy };
          });
        });
        localStorage.setItem('dinedesk_chen_layout_v3', JSON.stringify(payload));
      } catch(e) {}
    }

    function renderEntities() {
      entitiesLayer.innerHTML = '';
      CHEN_DATA.entities.forEach(ent => {
        const cl = CHEN_DATA.clusters[ent.cluster];
        const el = document.createElement('div');
        el.id = `entity-${ent.id}`;
        el.className = 'entity-box';
        el.style.left = `${ent.x}px`;
        el.style.top = `${ent.y}px`;
        el.style.width = `${ent.w}px`;
        el.style.height = `${ent.h}px`;
        el.style.border = `2.5px solid ${cl.color}`;
        el.style.color = cl.color;
        el.style.boxShadow = `0 0 16px ${cl.bg}`;
        el.innerText = ent.name;

        el.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          dragTarget = { type: 'entity', item: ent };
          const rect = el.getBoundingClientRect();
          dragOffset.x = (e.clientX - rect.left) / scale;
          dragOffset.y = (e.clientY - rect.top) / scale;
        });

        entitiesLayer.appendChild(el);
      });
    }

    function renderAttributes() {
      attributesLayer.innerHTML = '';
      CHEN_DATA.entities.forEach(ent => {
        const cl = CHEN_DATA.clusters[ent.cluster];
        ent.attributes.forEach((attr, idx) => {
          const pill = document.createElement('div');
          pill.id = `attr-${ent.id}-${attr.id || idx}`;
          pill.className = 'attr-pill';
          
          const posX = ent.x + (ent.w / 2) + attr.ox;
          const posY = ent.y + (ent.h / 2) + attr.oy;
          pill.style.left = `${posX}px`;
          pill.style.top = `${posY}px`;

          if (attr.type === 'pk') {
            pill.style.border = '1.5px solid #facc15';
            pill.style.color = '#fde047';
            pill.style.background = 'rgba(234, 179, 8, 0.22)';
          } else if (attr.type === 'fk') {
            pill.style.border = '1.5px solid #38bdf8';
            pill.style.color = '#7dd3fc';
            pill.style.background = 'rgba(56, 189, 248, 0.16)';
          } else if (attr.type === 'uq') {
            pill.style.border = '1.5px solid #c084fc';
            pill.style.color = '#e9d5ff';
            pill.style.background = 'rgba(192, 132, 252, 0.16)';
          } else {
            pill.style.border = `1.5px solid ${cl.border}`;
            pill.style.color = '#cbd5e1';
            pill.style.background = '#0f172a';
          }

          pill.innerText = attr.name;

          pill.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            e.stopPropagation();
            dragTarget = { type: 'pill', item: attr, parent: ent };
            const rect = pill.getBoundingClientRect();
            dragOffset.x = (e.clientX - rect.left) / scale;
            dragOffset.y = (e.clientY - rect.top) / scale;
          });

          attributesLayer.appendChild(pill);
        });
      });
    }

    function drawAllConnections() {
      relWiresGroup.innerHTML = '';
      attrStemsGroup.innerHTML = '';
      diamondsGroup.innerHTML = '';
      cardinalityGroup.innerHTML = '';

      // Stems
      CHEN_DATA.entities.forEach(ent => {
        const cl = CHEN_DATA.clusters[ent.cluster];
        const eCenter = { x: ent.x + ent.w / 2, y: ent.y + ent.h / 2 };

        ent.attributes.forEach((attr, idx) => {
          const attrEl = document.getElementById(`attr-${ent.id}-${attr.id || idx}`);
          if (!attrEl) return;

          const aCenter = { x: ent.x + (ent.w / 2) + attr.ox, y: ent.y + (ent.h / 2) + attr.oy };
          const cpX = (eCenter.x + aCenter.x) / 2;
          const cpY = (eCenter.y + aCenter.y) / 2;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${eCenter.x} ${eCenter.y} Q ${cpX} ${cpY}, ${aCenter.x} ${aCenter.y}`);
          path.setAttribute('class', 'stem-wire');
          path.setAttribute('stroke', cl.color);
          attrStemsGroup.appendChild(path);
        });
      });

      // Relationships
      CHEN_DATA.relationships.forEach(rel => {
        const e1 = CHEN_DATA.entities.find(e => e.id === rel.e1);
        const e2 = CHEN_DATA.entities.find(e => e.id === rel.e2);
        if (!e1 || !e2) return;

        const c1 = { x: e1.x + e1.w / 2, y: e1.y + e1.h / 2 };
        const c2 = { x: e2.x + e2.w / 2, y: e2.y + e2.h / 2 };

        let dCenter;
        if (customDiamondOffsets[rel.id]) {
          dCenter = {
            x: ((c1.x + c2.x) / 2) + customDiamondOffsets[rel.id].ox,
            y: ((c1.y + c2.y) / 2) + customDiamondOffsets[rel.id].oy
          };
        } else {
          dCenter = { x: (c1.x + c2.x) / 2, y: (c1.y + c2.y) / 2 };
        }

        const line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line1.setAttribute('x1', c1.x); line1.setAttribute('y1', c1.y);
        line1.setAttribute('x2', dCenter.x); line1.setAttribute('y2', dCenter.y);
        line1.setAttribute('class', 'rel-wire');
        relWiresGroup.appendChild(line1);

        const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line2.setAttribute('x1', dCenter.x); line2.setAttribute('y1', dCenter.y);
        line2.setAttribute('x2', c2.x); line2.setAttribute('y2', c2.y);
        line2.setAttribute('class', 'rel-wire');
        relWiresGroup.appendChild(line2);

        // Diamond
        const size = 34;
        const dGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        dGroup.setAttribute('class', 'rel-diamond');
        dGroup.setAttribute('transform', `translate(${dCenter.x}, ${dCenter.y})`);

        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', `0,-${size} ${size*1.35},0 0,{size} -${size*1.35},0`);
        polygon.setAttribute('points', `0,-${size} ${size*1.35},0 0,${size} -${size*1.35},0`);
        polygon.setAttribute('fill', '#0f172a');
        polygon.setAttribute('stroke', '#6366f1');
        polygon.setAttribute('stroke-width', '2.2');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dy', '4');
        text.setAttribute('fill', '#a5b4fc');
        text.setAttribute('font-size', '10px');
        text.setAttribute('font-weight', '800');
        text.textContent = rel.name;

        dGroup.appendChild(polygon);
        dGroup.appendChild(text);

        dGroup.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          if (!customDiamondOffsets[rel.id]) customDiamondOffsets[rel.id] = { ox: 0, oy: 0 };
          dragTarget = { type: 'diamond', rel: rel, initialMid: { x: (c1.x + c2.x)/2, y: (c1.y + c2.y)/2 } };
          dragOffset.x = (e.clientX / scale) - dCenter.x;
          dragOffset.y = (e.clientY / scale) - dCenter.y;
        });

        diamondsGroup.appendChild(dGroup);

        const card1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        card1.setAttribute('x', c1.x + (dCenter.x - c1.x) * 0.35 + 8);
        card1.setAttribute('y', c1.y + (dCenter.y - c1.y) * 0.35 - 8);
        card1.setAttribute('class', 'cardinality-text');
        card1.textContent = rel.c1;
        cardinalityGroup.appendChild(card1);

        const card2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        card2.setAttribute('x', dCenter.x + (c2.x - dCenter.x) * 0.65 + 8);
        card2.setAttribute('y', dCenter.y + (c2.y - dCenter.y) * 0.65 - 8);
        card2.setAttribute('class', 'cardinality-text');
        card2.textContent = rel.c2;
        cardinalityGroup.appendChild(card2);
      });
    }

    function updateTransform() {
      const transformStr = `translate(${panX}px, ${panY}px) scale(${scale})`;
      world.style.transform = transformStr;
      svgLayer.style.transform = transformStr;
      svgLayer.style.transformOrigin = '0 0';
    }

    function zoomDelta(dz) {
      scale = Math.min(Math.max(0.2, scale + dz), 2.5);
      updateTransform();
      drawAllConnections();
    }

    function resetZoom() {
      scale = 0.68;
      panX = 80;
      panY = 60;
      updateTransform();
      drawAllConnections();
    }

    function resetToSpaciousLayout() {
      localStorage.removeItem('dinedesk_chen_layout_v3');
      customDiamondOffsets = {};
      CHEN_DATA.entities.forEach(ent => {
        if (SPACIOUS_LAYOUT[ent.id]) {
          ent.x = SPACIOUS_LAYOUT[ent.id].x;
          ent.y = SPACIOUS_LAYOUT[ent.id].y;
          const el = document.getElementById(`entity-${ent.id}`);
          if (el) {
            el.style.left = `${ent.x}px`;
            el.style.top = `${ent.y}px`;
          }
        }
      });
      scale = 0.68;
      panX = 80;
      panY = 60;
      updateTransform();
      renderAttributes();
      drawAllConnections();
    }

    function filterCluster(clusterKey) {
      activeCluster = clusterKey;
      document.querySelectorAll('.cluster-btn').forEach(b => {
        if (b.dataset.cluster === clusterKey) b.classList.add('active');
        else b.classList.remove('active');
      });

      CHEN_DATA.entities.forEach(ent => {
        const el = document.getElementById(`entity-${ent.id}`);
        if (!el) return;
        el.style.display = (clusterKey === 'ALL' || ent.cluster === clusterKey) ? 'flex' : 'none';
      });

      renderAttributes();
      drawAllConnections();
    }

    function handleSearch(query) {
      const q = query.trim().toUpperCase();
      if (!q) {
        document.querySelectorAll('.entity-box').forEach(e => e.style.opacity = '1');
        document.querySelectorAll('.attr-pill').forEach(a => a.style.opacity = '1');
        return;
      }

      CHEN_DATA.entities.forEach(ent => {
        const entEl = document.getElementById(`entity-${ent.id}`);
        const matchEnt = ent.name.includes(q);
        const matchAttr = ent.attributes.some(a => a.name.toUpperCase().includes(q));

        if (matchEnt || matchAttr) entEl.style.opacity = '1';
        else entEl.style.opacity = '0.15';

        ent.attributes.forEach((a, i) => {
          const attrEl = document.getElementById(`attr-${ent.id}-${a.id || i}`);
          if (attrEl) {
            attrEl.style.opacity = (a.name.toUpperCase().includes(q) || matchEnt) ? '1' : '0.15';
          }
        });
      });
    }

    function setupInteractions() {
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.entity-box') || e.target.closest('.attr-pill') || e.target.closest('.rel-diamond') || e.target.closest('button') || e.target.closest('input')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (isPanning) {
          panX = e.clientX - startX;
          panY = e.clientY - startY;
          updateTransform();
        } else if (dragTarget) {
          const worldRect = world.getBoundingClientRect();

          if (dragTarget.type === 'entity') {
            const ent = dragTarget.item;
            const newX = (e.clientX - worldRect.left) / scale - dragOffset.x;
            const newY = (e.clientY - worldRect.top) / scale - dragOffset.y;
            ent.x = Math.max(0, newX);
            ent.y = Math.max(0, newY);

            const el = document.getElementById(`entity-${ent.id}`);
            if (el) {
              el.style.left = `${ent.x}px`;
              el.style.top = `${ent.y}px`;
            }

            ent.attributes.forEach((attr, idx) => {
              const attrEl = document.getElementById(`attr-${ent.id}-${attr.id || idx}`);
              if (attrEl) {
                attrEl.style.left = `${ent.x + (ent.w / 2) + attr.ox}px`;
                attrEl.style.top = `${ent.y + (ent.h / 2) + attr.oy}px`;
              }
            });
            drawAllConnections();
          } else if (dragTarget.type === 'pill') {
            const attr = dragTarget.item;
            const parentEnt = dragTarget.parent;
            const currentMouseX = (e.clientX - worldRect.left) / scale;
            const currentMouseY = (e.clientY - worldRect.top) / scale;

            attr.ox = currentMouseX - (parentEnt.x + parentEnt.w / 2);
            attr.oy = currentMouseY - (parentEnt.y + parentEnt.h / 2);

            const pillEl = document.getElementById(`attr-${parentEnt.id}-${attr.id}`);
            if (pillEl) {
              pillEl.style.left = `${parentEnt.x + (parentEnt.w / 2) + attr.ox}px`;
              pillEl.style.top = `${parentEnt.y + (parentEnt.h / 2) + attr.oy}px`;
            }
            drawAllConnections();
          } else if (dragTarget.type === 'diamond') {
            const rel = dragTarget.rel;
            const currentMouseX = (e.clientX / scale) - dragOffset.x;
            const currentMouseY = (e.clientY / scale) - dragOffset.y;

            customDiamondOffsets[rel.id] = {
              ox: currentMouseX - dragTarget.initialMid.x,
              oy: currentMouseY - dragTarget.initialMid.y
            };
            drawAllConnections();
          }
        }
      });

      window.addEventListener('mouseup', () => {
        if (isPanning) {
          isPanning = false;
          viewport.style.cursor = 'default';
        }
        if (dragTarget) {
          savePositionsToStorage();
          dragTarget = null;
        }
      });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomDelta(e.deltaY < 0 ? 0.08 : -0.08);
      }, { passive: false });

      window.addEventListener('resize', drawAllConnections);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
